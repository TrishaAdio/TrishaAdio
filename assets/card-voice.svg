<style>@font-face{font-family:'p-display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.display{font-family:'p-display','Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;font-style:normal}@font-face{font-family:'p-body';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.body{font-family:'p-body','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500;font-style:normal}.serif{font-family:'p-serif',Georgia,'Times New Roman',serif;font-weight:400;font-style:italic}@font-face{font-family:'p-mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.mono{font-family:'p-mono',Consolas,Menlo,monospace;font-weight:500;font-style:normal}.c-b0{animation:c-d0 11s ease-in-out infinite alternate}@keyframes c-d0{to{transform:translate(-50px,30px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
