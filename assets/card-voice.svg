<svg xmlns="http://www.w3.org/2000/svg" width="600" height="232" viewBox="0 0 600 232" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Voice model training</title>
<desc id="desc">TTS / ML. Fine-tunes a natural GPT-SoVITS voice from your own clips, then serves it over an API your AI can call.</desc>
