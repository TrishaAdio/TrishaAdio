name: Profile artwork

# Rebuilds the live stats card and the contribution snake, then publishes both to the
# `output` branch that README.md links to. Static artwork lives in assets/ on main.
on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the stats card
        run: node scripts/build.mjs stats dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Build the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#581c87
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3b0764,#6b21a8,#a855f7,#e9d5ff

      # Replaces the branch contents with dist/, so every file the README needs must be built above.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile artwork"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
